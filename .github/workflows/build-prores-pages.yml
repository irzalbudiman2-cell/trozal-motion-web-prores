name: Build ProRes WASM and Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'canvas-3d-studio.js
          browser-render-engine-groups.js'
      - 'canvas-3d-ai-theme-studio.js'
      - 'canvas-3d-terminal.js'
      - 'tests/canvas-3d-ai-theme-terminal.test.cjs'
      - 'tests/canvas-3d-ai-theme-terminal.browser.cjs'
      - 'js/ollama-universal-object-rig.js'
      - 'tests/ollama-universal-rig.test.cjs'
      - 'render-frame-store.js'
      - 'logo-studio.js'
      - 'tests/logo-studio-contract.test.cjs'
      - 'tests/render-frame-store.test.cjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout TROZAL MOTION
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/vendor/ffmpeg site/vendor/prores-core site/js
          cp index.html site/index.html
          cp js/ollama-universal-object-rig.js site/js/ollama-universal-object-rig.js
          cp trozal-image-to-code-video.js site/trozal-image-to-code-video.js
          cp metadata-actions.js site/metadata-actions.js
          cp ip-guardrails-panel.js site/ip-guardrails-panel.js
          cp preview-proxy.js site/preview-proxy.js
          cp render-memory-manager.js site/render-memory-manager.js
          cp render-frame-store.js site/render-frame-store.js
          cp logo-studio.js site/logo-studio.js
          cp icon-logo-motion-studio.js site/icon-logo-motion-studio.js
          cp canvas-3d-studio.js site/canvas-3d-studio.js
          cp browser-render-engine-groups.js site/browser-render-engine-groups.js
          cp canvas-3d-ai-theme-studio.js site/canvas-3d-ai-theme-studio.js
          cp canvas-3d-terminal.js site/canvas-3d-terminal.js
          touch site/.nojekyll

      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check site/trozal-image-to-code-video.js
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { spawnSync } = require('child_process');
          const html = fs.readFileSync('site/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script\s*>/gi)];
          if (!scripts.length) throw new Error('No script blocks found in site/index.html');
          scripts.forEach((match, index) => {
            const file = path.join('/tmp', 'trozal-inline-' + index + '.js');
            fs.writeFileSync(file, match[1], 'utf8');
            const result = spawnSync(process.execPath, ['--check', file], { encoding: 'utf8' });
            if (result.status !== 0) {
              process.stderr.write('JavaScript syntax error in script block ' + (index + 1) + '\n');
              process.stderr.write(result.stderr || result.stdout || '');
              process.exit(1);
            }
          });
          console.log('Validated JavaScript syntax in ' + scripts.length + ' script block(s).');
          NODE

      - name: Test render frame store and Logo Studio contract
        run: node --test tests/render-frame-store.test.cjs tests/logo-studio-contract.test.cjs tests/illustrative-logo-studio.test.cjs

      - name: Vendor FFmpeg worker package and JSZip locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/npm-ffmpeg /tmp/npm-jszip
          npm pack @ffmpeg/ffmpeg@0.12.15 --pack-destination /tmp/npm-ffmpeg
          tar -xzf /tmp/npm-ffmpeg/ffmpeg-ffmpeg-0.12.15.tgz -C /tmp/npm-ffmpeg
          cp -R /tmp/npm-ffmpeg/package/dist/esm/. site/vendor/ffmpeg/
          npm pack jszip@3.10.1 --pack-destination /tmp/npm-jszip
          tar -xzf /tmp/npm-jszip/jszip-3.10.1.tgz -C /tmp/npm-jszip
          cp /tmp/npm-jszip/package/dist/jszip.min.js site/vendor/jszip.min.js
          test -s site/vendor/ffmpeg/index.js
          test -s site/vendor/ffmpeg/worker.js
          test -s site/vendor/jszip.min.js

      - name: Build FFmpeg core with ProRes 4444 enabled
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v12.15 https://github.com/ffmpegwasm/ffmpeg.wasm.git /tmp/ffmpeg-wasm
          cd /tmp/ffmpeg-wasm
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("Dockerfile")
          text = p.read_text()

          # Upstream emsdk Dockerfile uses Ubuntu apt repositories over HTTP.
          # Force HTTPS so Docker build does not hang on archive.ubuntu.com:80.
          apt_pattern = r"(?m)^(?P<indent>[ ]*)RUN apt-get update && \\\n(?P=indent)      apt-get install -y pkg-config autoconf automake libtool ragel\s*$"
          apt_lines = [
              "RUN find /etc/apt -type f \\( -name '*.list' -o -name '*.sources' \\) -exec sed -i \\",
              "      -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \\",
              "      -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' {} + && \\",
              "      apt-get -o Acquire::Retries=5 -o Acquire::https::Timeout=60 update && \\",
              "      apt-get install -y --no-install-recommends pkg-config autoconf automake libtool ragel",
          ]
          patched, apt_count = re.subn(
              apt_pattern,
              lambda m: "\n".join(m.group("indent") + line for line in apt_lines),
              text,
              count=1,
          )
          if apt_count != 1:
              raise SystemExit("Could not locate emsdk apt dependency block; no build performed.")

          # Keep retries on later apt-get layers as well (zimg-builder).
          patched = patched.replace(
              "RUN apt-get update && apt-get install -y git",
              "RUN apt-get -o Acquire::Retries=5 -o Acquire::https::Timeout=60 update && apt-get install -y --no-install-recommends git",
          )

          # Enable the ProRes encoder and MOV/PNG input-output support.
          pattern = r"(?m)^(?P<indent>[ ]*)RUN bash -x /src/build\.sh \\\n(?P=indent)      --enable-gpl \\\n"

          def patch(match):
              indent = match.group("indent")
              lines = [
                  "RUN bash -x /src/build.sh \\",
                  "      --enable-encoder=prores_ks \\",
                  "      --enable-decoder=png \\",
                  "      --enable-demuxer=image2 \\",
                  "      --enable-muxer=mov \\",
                  "      --enable-protocol=file \\",
                  "      --enable-gpl \\",
              ]
              return "\n".join(indent + line for line in lines) + "\n"

          patched, count = re.subn(pattern, patch, patched, count=1)
          if count != 1:
              raise SystemExit("Could not locate FFmpeg configure block with indentation; no build performed.")
          p.write_text(patched)

          PY
          make prd
          mkdir -p "$GITHUB_WORKSPACE/site/vendor/prores-core"
          cp packages/core/dist/esm/ffmpeg-core.js "$GITHUB_WORKSPACE/site/vendor/prores-core/"
          cp packages/core/dist/esm/ffmpeg-core.wasm "$GITHUB_WORKSPACE/site/vendor/prores-core/"
          test -s "$GITHUB_WORKSPACE/site/vendor/prores-core/ffmpeg-core.js"
          test -s "$GITHUB_WORKSPACE/site/vendor/prores-core/ffmpeg-core.wasm"

      - name: Verify build outputs
        shell: bash
        run: |
          set -euo pipefail
          grep -q -- '--enable-encoder=prores_ks' /tmp/ffmpeg-wasm/Dockerfile
          test -s site/index.html
          test -s site/js/ollama-universal-object-rig.js
          node --check site/js/ollama-universal-object-rig.js
          grep -q 'js/ollama-universal-object-rig.js' site/index.html
          test -s site/logo-studio.js
          node --check site/logo-studio.js
          test -s site/icon-logo-motion-studio.js
          test -s site/canvas-3d-studio.js
          node --check site/canvas-3d-studio.js
          test -s site/canvas-3d-ai-theme-studio.js
          test -s site/canvas-3d-terminal.js
          node --check site/canvas-3d-ai-theme-studio.js
          node --check site/canvas-3d-terminal.js
          grep -q 'canvas-3d-terminal.js' site/index.html
          node --check site/icon-logo-motion-studio.js
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('site/icon-logo-motion-studio.js', 'utf8');
          const countMatch = source.match(/const motifs=Array\.from\(\{length:(\d+)\}/);
          if (!countMatch || Number(countMatch[1]) !== 1500) throw new Error('Expected exactly 1,500 generated logo concepts');
          const domainsMatch = source.match(/const logoDomains=\[([\s\S]*?)\];/);
          if (!domainsMatch || (domainsMatch[1].match(/'[^']+'/g) || []).length !== 30) throw new Error('Expected 30 conceptual logo domains');
          const nameA = source.match(/const nameA=\[([^\]]+)\]/);
          const nameB = source.match(/const nameB=\[([^\]]+)\]/);
          if (!nameA || !nameB) throw new Error('Unique logo naming dictionaries missing');
          const hasVectorHelpers = source.includes('const path=(d,fill=p') && source.includes('const ellipse=') && source.includes('const circle=') && source.includes('const poly=');
          const hasAnimatedParts = source.includes('tm4-part') && source.includes('data-part=') && source.includes('<svg xmlns=') && source.includes('viewBox="0 0 240 240"');
          if (!hasVectorHelpers || !hasAnimatedParts) throw new Error('Logo artwork must define SVG vector primitives and independently animated semantic parts');
          if (!source.includes('String(i+1).padStart(4')) throw new Error('Sequential unique logo identifiers missing');
          console.log('Verified 1,500 procedural logo concepts across 30 domains with frameless SVG vector artwork.');
          NODE
          test -s site/render-frame-store.js
          test -s site/vendor/ffmpeg/worker.js
          test -s site/vendor/prores-core/ffmpeg-core.js
          test -s site/vendor/prores-core/ffmpeg-core.wasm
          ls -lh site/vendor/prores-core site/vendor/ffmpeg | head -40
          du -sh site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site


  deploy-pages:
    needs: build-site
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
