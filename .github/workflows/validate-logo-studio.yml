name: Validate OLLAMA Logo Studio

on:
  pull_request:
    branches: [main]
    paths:
      - 'icon-logo-motion-studio.js'
      - 'tests/logo-composition-playback.test.cjs'
      - 'tests/illustrative-logo-studio.test.cjs'
      - 'tests/icon-logo-motion-studio.browser.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ollama-logo-studio-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  logo-studio-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout OLLAMA
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Logo Studio JavaScript syntax
        run: node --check icon-logo-motion-studio.js
      - name: Test 1,500 illustrated logo concepts and SVG families
        run: node --test tests/illustrative-logo-studio.test.cjs
      - name: Test logo composition and playback contract
        run: node tests/logo-composition-playback.test.cjs

  logo-studio-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout OLLAMA
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Test Logo Studio controls, composition, export and playback in Chromium
        run: node tests/icon-logo-motion-studio.browser.cjs
