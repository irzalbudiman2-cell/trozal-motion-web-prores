name: OLLAMA Browser Smoke Test

on:
  push:
    branches:
      - ollama-repair-cb774c0-2026-11-15
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ollama-http.log 2>&1 &
          echo $! > /tmp/ollama-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-http.log
          exit 1

      - name: Exercise OLLAMA UI in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));

            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1200);

            const required = [
              'svgTerminalPanel', 'aiCodeTerminal', 'applyAiSvgBtn',
              'svgAiThemeSearch', 'svgAiRandomThemeBtn', 'svgAiPrompt',
              'generateSvgAiPromptBtn', 'workspaceTools', 'workspaceEditor',
              'batchQueuePanel', 'batchQueueStatus', 'playBtn', 'stopBtn'
            ];
            for (const id of required) {
              assert.equal(await page.locator('#' + id).count(), 1, 'Expected exactly one #' + id);
            }

            await page.locator('#helpBtn').click();
            await page.waitForFunction(() => !document.getElementById('workspaceTools').hidden);
            await page.locator('#workspaceToolsClose').click();

            await page.locator('#resetLayoutBtn').click();
            await page.waitForFunction(() => !document.getElementById('workspaceEditor').hidden);
            await page.locator('#workspaceEditorClose').click();

            await page.locator('#generateSvgAiPromptBtn').click();
            await page.waitForFunction(() => document.getElementById('svgAiPrompt').value.trim().length > 40);
            const generatedPromptLength = await page.locator('#svgAiPrompt').inputValue().then(v => v.length);
            assert.ok(generatedPromptLength > 40, 'Generate Prompt should populate the prompt textarea');

            const beforeTheme = await page.locator('#svgAiTheme').inputValue();
            await page.locator('#svgAiRandomThemeBtn').click();
            await page.waitForTimeout(180);
            const afterTheme = await page.locator('#svgAiTheme').inputValue();
            assert.ok(afterTheme, 'Random theme should leave a selected theme');

            await page.locator('#playBtn').click();
            await page.waitForTimeout(250);
            assert.match(await page.locator('#playBtn').innerText(), /Jeda|Pause/i);
            await page.locator('#stopBtn').click();
            assert.match(await page.locator('#playBtn').innerText(), /Putar|Play/i);

            assert.deepEqual(pageErrors, [], 'Unexpected uncaught browser JavaScript errors');
            console.log(JSON.stringify({
              result: 'PASS',
              checkedElements: required.length,
              generatedPromptLength,
              randomThemeChanged: beforeTheme !== afterTheme,
              exercised: ['Pusat Utilitas', 'Tata Letak', 'Generate Prompt', 'Tema Inspirasi Acak', 'Timeline Putar/Stop']
            }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Stop local app server
        if: always()
        run: |
          if [ -f /tmp/ollama-http.pid ]; then kill "$(cat /tmp/ollama-http.pid)" || true; fi
