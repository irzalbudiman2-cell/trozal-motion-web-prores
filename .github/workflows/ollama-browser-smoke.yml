name: OLLAMA Browser Smoke Test

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'icon-logo-motion-studio.js'
      - 'tests/logo-composition-playback.test.cjs'
      - 'tests/illustrative-logo-studio.test.cjs'
      - 'tests/icon-logo-motion-studio.browser.cjs'
      - '.github/workflows/validate-ollama-repair.yml'
      - '.github/workflows/ollama-browser-smoke.yml'
      - '.github/workflows/build-prores-pages.yml'
      - '.github/workflows/validate-logo-studio.yml'
  push:
    branches:
      - ollama-repair-cb774c0-2026-11-15
      - ollama-semantic-object-groups-2026-11-15
      - feature/theme-intelligence-floating-render-20261115
      - feature/ollama-smart-model-manager-2026-11-15
      - feature/ollama-streaming-generation-2026-11-16
      - feature/ollama-adaptive-render-advisor-2026-11-16
      - feature/ollama-hybrid-canvas-bitrate-health-fix-2026-11-16
      - feature/ollama-scene-composer-scene-intelligence-2026-11-16
      - feature/original-content-ip-panel-2026-11-18
      - feature/preview-proxy-canvas-2026-11-18
      - feature/ollama-adaptive-render-memory-2026-11-18
      - feature/ollama-canvas3d-terminal-ip-random-20261128
      - fix/ollama-canvas3d-import-smoke-20261128
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright jszip
          npx playwright install --with-deps chromium

      - name: Start local app server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/ollama-http.log 2>&1 &
          echo $! > /tmp/ollama-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama-http.log
          exit 1

      - name: Verify independent Logo Studio catalogue, motion, prompt and Canvas import
        run: node tests/logo-studio.browser.cjs

      - name: Verify Hybrid Canvas, bitrate, Ollama and GPU health regression guards
        run: |
          node tests/hybrid-canvas-bitrate-health.test.cjs
          node tests/hybrid-canvas-bitrate-health.browser.cjs
          node tests/ollama-vision-metadata-json.test.cjs
          node tests/ip-guardrails-panel.test.cjs

      - name: Verify adaptive render memory manager
        run: node tests/render-memory-manager.test.cjs
      - name: Verify Preview Proxy changes only preview canvas resolution
        run: node tests/preview-proxy.browser.cjs
      - name: Verify Mode 5 preview ratios, Loop toggle and composition guides
        run: node tests/image-to-code-preview-controls.browser.cjs

      - name: Exercise OLLAMA UI in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.message));

            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
            await page.waitForTimeout(1200);

            // Exercise semantic SVG grouping using explicit parent metadata.
            const semanticSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80">
              <g data-object="Robot" transform="translate(5 5)">
                <path data-part="Head" d="M20 5h30v20H20z" fill="#e85d5d"/>
                <path data-part="Body" d="M25 28h20v30H25z" fill="#5577dd"/>
              </g>
              <rect id="Floor" x="5" y="65" width="100" height="5" fill="#444"/>
            </svg>`;
            await page.locator('#fileInput').setInputFiles({
              name: 'semantic-robot.svg',
              mimeType: 'image/svg+xml',
              buffer: Buffer.from(semanticSvg)
            });
            await page.waitForFunction(() => document.querySelectorAll('#mtTrackList .mt-group-tag').length === 2);
            assert.equal(await page.locator('#mtTrackList [data-mt-row]').count(), 3, 'SVG parts should remain separate editable tracks');
            await page.locator('#mtTrackList [data-mt-select="0"]').click();
            await page.locator('#mtToggleGroupVisibility').click();
            await page.waitForFunction(() =>
              document.querySelector('#autoLayerVisible0')?.checked === false &&
              document.querySelector('#autoLayerVisible1')?.checked === false
            );
            await page.locator('#mtToggleGroupVisibility').click();

            await page.locator('#mtToggleGroupLock').click();
            let groupLocks = await page.evaluate(() => getProject().timelineTrackLocks);
            assert.equal(groupLocks['0'], true, 'Group lock should lock the first member');
            assert.equal(groupLocks['1'], true, 'Group lock should lock the second member');
            await page.locator('#mtToggleGroupLock').click();

            await page.locator('#kfX0').fill('18');
            await page.locator('#kfTime0').fill('0.8');
            await page.locator('#mtGroupKeyframe').click();
            let groupState = await page.evaluate(() => {
              const project = getProject();
              return {
                groups: project.timelineLayerGroups,
                first: project.layerKeyframes[0],
                second: project.layerKeyframes[1]
              };
            });
            assert.equal(groupState.groups['0'], 'Robot', 'Semantic parent label should become a named group');
            assert.equal(groupState.groups['1'], 'Robot', 'Related paths should share the same logical group');
            assert.deepEqual(groupState.first, groupState.second, 'Group keyframe should synchronize member keyframes');

            await page.locator('#mtSelectGroupMembers').click();
            assert.equal(await page.locator('#mtTrackList [data-mt-group-pick="0"]').isChecked(), true);
            assert.equal(await page.locator('#mtTrackList [data-mt-group-pick="1"]').isChecked(), true);

            await page.evaluate(() => {
              const snapshot = getProject();
              applyProject(snapshot);
            });
            groupState = await page.evaluate(() => {
              const project = getProject();
              return {
                groups: project.timelineLayerGroups,
                first: project.layerKeyframes[0],
                second: project.layerKeyframes[1]
              };
            });
            assert.equal(groupState.groups['0'], 'Robot', 'Semantic group should survive project save/reopen');
            assert.deepEqual(groupState.first, groupState.second, 'Synchronized group keyframes should survive project save/reopen');

            const required = [
              'svgTerminalPanel', 'aiCodeTerminal', 'applyAiSvgBtn',
              'svgAiThemeSearch', 'svgAiRandomThemeBtn', 'svgAiPrompt',
              'generateSvgAiPromptBtn', 'workspaceTools', 'workspaceEditor',
              'batchQueuePanel', 'batchQueueStatus', 'playBtn', 'stopBtn'
            ];
            for (const id of required) {
              assert.equal(await page.locator('#' + id).count(), 1, 'Expected exactly one #' + id);
            }

            await page.locator('#helpBtn').click();
            await page.waitForFunction(() => !document.getElementById('workspaceTools').hidden);
            await page.locator('#workspaceToolsClose').click();

            await page.locator('#resetLayoutBtn').click();
            await page.waitForFunction(() => !document.getElementById('workspaceEditor').hidden);
            await page.locator('#workspaceEditorClose').click();

            await page.locator('#generateSvgAiPromptBtn').click();
            await page.waitForFunction(() => document.getElementById('svgAiPrompt').value.trim().length > 40);
            const generatedPromptLength = await page.locator('#svgAiPrompt').inputValue().then(v => v.length);
            assert.ok(generatedPromptLength > 40, 'Generate Prompt should populate the prompt textarea');

            const beforeTheme = await page.locator('#svgAiTheme').inputValue();
            await page.locator('#svgAiRandomThemeBtn').click();
            await page.waitForTimeout(180);
            const afterTheme = await page.locator('#svgAiTheme').inputValue();
            assert.ok(afterTheme, 'Random theme should leave a selected theme');

            await page.locator('#playBtn').click();
            await page.waitForTimeout(250);
            assert.match(await page.locator('#playBtn').innerText(), /Jeda|Pause/i);
            await page.locator('#stopBtn').click();
            assert.match(await page.locator('#playBtn').innerText(), /Putar|Play/i);

            assert.deepEqual(pageErrors, [], 'Unexpected uncaught browser JavaScript errors');
            console.log(JSON.stringify({
              result: 'PASS',
              checkedElements: required.length,
              generatedPromptLength,
              randomThemeChanged: beforeTheme !== afterTheme,
              semanticObjectGroup: 'PASS',
              groupLockVisibilityKeyframesAndPersistence: 'PASS',
              exercised: ['Semantic SVG object grouping', 'Group visibility/lock/selection/keyframes/persistence', 'Pusat Utilitas', 'Tata Letak', 'Generate Prompt', 'Tema Inspirasi Acak', 'Timeline Putar/Stop']
            }, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify compact Runtime Diagnostics minimize and restore
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#trozalDebugFab');
            await page.locator('#trozalDebugFab').click();
            await page.waitForFunction(() => document.getElementById('trozalDebugPanel')?.classList.contains('open'));
            await page.locator('#trozalDebugPanel .debug-minimize').click();
            await page.waitForFunction(() => document.getElementById('trozalDebugPanel')?.classList.contains('minimized'));
            const compact = await page.locator('#trozalDebugPanel').evaluate(el => ({
              width: el.getBoundingClientRect().width,
              logDisplay: getComputedStyle(document.getElementById('trozalDebugLog')).display,
              copyDisplay: getComputedStyle(el.querySelector('button:not(.debug-minimize)')).display
            }));
            assert.ok(compact.width <= 300, 'Minimized diagnostics should become a compact floating pill');
            assert.equal(compact.logDisplay, 'none', 'Log should be hidden while minimized');
            assert.equal(compact.copyDisplay, 'none', 'Secondary controls should be hidden while minimized');
            await page.locator('#trozalDebugPanel .debug-minimize').click();
            await page.waitForFunction(() => !document.getElementById('trozalDebugPanel')?.classList.contains('minimized'));
            assert.notEqual(await page.locator('#trozalDebugLog').evaluate(el => getComputedStyle(el).display), 'none');
            assert.deepEqual(errors, [], 'Unexpected browser page errors');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Verify Motion Speed Calibration reports FPS and restores playhead
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const errors = [];
            page.on('pageerror', e => errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#motionSpeedCalibrate');
            await page.locator('#scrubber').evaluate(el => { el.value='250'; el.dispatchEvent(new Event('input',{bubbles:true})); });
            const before = Number(await page.locator('#scrubber').inputValue());
            await page.locator('#motionSpeedCalibrate').click();
            await page.waitForFunction(() => /Preview .* FPS \/ target .* frame terlewat/.test(document.getElementById('motionSpeedCalibrationStatus')?.textContent || ''), { timeout: 8000 });
            const status = await page.locator('#motionSpeedCalibrationStatus').innerText();
            assert.match(status, /FPS \/ target/, 'Calibration should report measured and target FPS');
            assert.match(status, /frame terlewat/, 'Calibration should estimate dropped frames');
            const after = Number(await page.locator('#scrubber').inputValue());
            assert.ok(Math.abs(after-before) < 0.03, 'Calibration should restore the original playhead position');
            assert.deepEqual(errors, [], 'Unexpected browser page errors');
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE

      - name: Test OLLAMA Universal Object Rig, SAM masks and self-contained export
        run: node tests/ollama-universal-rig.browser.cjs

      - name: Validate scene intelligence beat planning and continuity guidance
        run: node tests/scene-intelligence.test.cjs
      - name: Validate adaptive render advisor recommendations and safe apply
        run: node tests/render-advisor.browser.cjs
      - name: Validate incremental Ollama NDJSON streaming
        run: node tests/ollama-streaming.browser.cjs
      - name: Guard central workspace and export capabilities
        run: node tests/workspace-export-preservation.test.cjs


      - name: Validate theme categories and AI prompt alignment in Chromium
        run: node tests/theme-concept-alignment.browser.cjs
      - name: Audit all catalogue themes and domain-specific AI prompts
        run: node tests/theme-catalogue-coverage.browser.cjs
      - name: Compare render throughput with pointer over and away from progress panel
        run: node tests/render-pointer-independence.browser.cjs

      - name: Test CANVAS 3D WebGL2 scene, transforms, motion and exports
        run: node tests/canvas-3d-studio.browser.cjs

      - name: Test OLLAMA CANVAS 3D AI Theme Studio and JavaScript / JSON Terminal
        run: node tests/canvas-3d-ai-theme-terminal.browser.cjs

      - name: Test CANVAS 3D Multi Terminal formats and imported mesh rendering
        run: |
          node --check canvas-3d-multi-terminal.js
          node --check canvas-3d-studio.js
          node --check tests/canvas-3d-multi-terminal.browser.cjs
          node tests/canvas-3d-multi-terminal.browser.cjs

      - name: Stop local app server
        if: always()
        run: |
          if [ -f /tmp/ollama-http.pid ]; then kill "$(cat /tmp/ollama-http.pid)" || true; fi
